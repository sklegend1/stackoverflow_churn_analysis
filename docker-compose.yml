services:
  mysql:
    image: mysql:8.0
    container_name: xml-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: xml_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - "3307:3306"  
    command: --local-infile=1
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./xml:/xml